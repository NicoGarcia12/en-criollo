<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">

  <!-- === SOMBRERO === -->
  <!-- Copa: trapezoide cuadrado, laterales casi rectos -->
  <path d="M62 74 L65 40 L135 40 L138 74"
        fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Techo con leve hundimiento central -->
  <path d="M65 40 Q100 35 135 40"
        fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Cinta del sombrero -->
  <path d="M63 67 Q100 70 137 67"
        fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ala: ancha, casi horizontal, extremos con leve caída -->
  <path d="M14 72 Q32 63 62 74 Q100 79 138 74 Q168 63 186 72 Q180 86 155 82 Q100 87 45 82 Q20 86 14 72Z"
        fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- === CARA === -->
  <!-- Óvalo cara: bien proporcionado -->
  <ellipse cx="100" cy="122" rx="31" ry="34" fill="none" stroke="#22c55e" stroke-width="3.5"/>

  <!-- Cejas: rectas y gruesas, expresión seria, fruncidas hacia el centro -->
  <path d="M76 106 Q85 101 94 104" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M106 104 Q115 101 124 106" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Ojos: almendras -->
  <path d="M76 113 Q85 108 94 113 Q85 118 76 113Z"
        fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 113 Q115 108 124 113 Q115 118 106 113Z"
        fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pupilas -->
  <circle cx="85" cy="113" r="2.8" fill="#22c55e"/>
  <circle cx="115" cy="113" r="2.8" fill="#22c55e"/>

  <!-- Nariz: forma triangular simple -->
  <path d="M95 120 L93 131 Q100 134 107 131 L105 120"
        fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- BIGOTE GAUCHO: manubrio — líneas que suben hacia afuera desde el centro
       Centro abajo (100,140), extremos arriba (62,118) y (138,118) -->
  <!-- Mitad izq: sube hacia la izquierda, con pequeño rulo al final -->
  <path d="M100 140 L68 120 Q62 116 58 120"
        fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mitad der: espejo -->
  <path d="M100 140 L132 120 Q138 116 142 120"
        fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Boca debajo del bigote -->
  <path d="M90 146 Q100 150 110 146"
        fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Barbilla / barba corta -->
  <path d="M88 152 Q100 158 112 152"
        fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === PAÑUELO EN V === -->
  <!-- Cuello: dos líneas laterales -->
  <path d="M74 154 L70 162" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <path d="M126 154 L130 162" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <!-- Borde superior del pañuelo -->
  <path d="M68 162 Q100 157 132 162"
        fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <!-- V del pañuelo: grande y presencia -->
  <path d="M60 168 L100 200 L140 168"
        fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Solapa encimada -->
  <path d="M60 168 Q80 165 100 168 Q120 165 140 168"
        fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <!-- Nudo central prominente -->
  <path d="M93 168 Q100 175 107 168"
        fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pliegues laterales -->
  <path d="M62 172 Q68 184 73 196"
        fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <path d="M138 172 Q132 184 127 196"
        fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

</svg>
