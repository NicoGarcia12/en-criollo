name: CI

# Generado por engram-sync (agentes-ia) para repos personales sin CI propio.
# Corre lint/build/test si esos scripts existen en package.json; no falla si faltan
# (npm run ... --if-present). No bloquea el merge por sí solo: eso depende de si
# el repo tiene branch protection configurada en GitHub.
on:
  pull_request:
  push:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present
